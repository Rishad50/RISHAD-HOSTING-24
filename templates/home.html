<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="JUBAYER HOSTING - Cloud Python & Termux Server Management Dashboard">
    <title>JUBAYER HOSTING — Control Panel</title>

    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ANSI Color Parser Library for Termux Logs -->
    <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>

    <style>
        /* ==========================================================================
           JUBAYER HOSTING - PREMIUM DARK THEME
           ========================================================================== */
        :root {
            --bg-base: #0c0f14;
            --bg-surface: #121720;
            --bg-card: #18202c;
            --bg-card-hover: #1e2837;
            --bg-input: #0f141d;
            
            --border-color: #232d3d;
            --border-focus: #3b82f6;

            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --color-success: #10b981;
            --color-success-hover: #059669;
            --color-warning: #f59e0b;
            --color-warning-hover: #d97706;
            --color-danger: #ef4444;
            --color-danger-hover: #dc2626;

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;

            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            --font-mono: 'Courier New', "JetBrains Mono", Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono { font-family: var(--font-mono); }
        .text-muted { color: var(--text-muted); }
        .text-bold { font-weight: 600; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .max-w-700 { max-width: 700px; }
        .py-4 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .text-center { text-align: center; }

        /* Layout */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .top-header {
            height: 60px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.2rem;
            position: relative;
            z-index: 40;
        }

        .header-menu-toggle {
            position: absolute;
            left: 1.2rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-menu-toggle:hover { color: var(--text-main); }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            user-select: none;
        }
        .brand-accent { color: var(--color-primary); }

        /* Main Body & Sidebar */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1rem;
            gap: 1rem;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 35;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 0.95rem;
            border-radius: var(--radius-md);
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }
        .nav-item i { width: 18px; text-align: center; font-size: 1rem; }
        .nav-item:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }
        .nav-item.active {
            background: rgba(59, 130, 246, 0.18);
            color: var(--color-primary);
            font-weight: 700;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 60px; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 30;
        }
        .sidebar-backdrop.show { display: block; }

        /* Content Area */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: var(--bg-base);
        }

        .tab-pane {
            display: none;
            height: 100%;
        }
        .tab-pane.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header-row {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 0.9rem;
            width: 100%;
        }

        /* Buttons & Action Bar */
        .action-btn-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            flex-wrap: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.65rem 0.6rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            flex: 1;
            white-space: nowrap;
        }

        .btn-sm {
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
            flex: none;
        }

        .btn-primary { background: var(--color-primary); color: #fff; }
        .btn-primary:hover { background: var(--color-primary-hover); }

        .btn-success { background: var(--color-success); color: #fff; }
        .btn-success:hover { background: var(--color-success-hover); }

        .btn-warning { background: var(--color-warning); color: #fff; }
        .btn-warning:hover { background: var(--color-warning-hover); }

        .btn-danger { background: var(--color-danger); color: #fff; }
        .btn-danger:hover { background: var(--color-danger-hover); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border-color: var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-dim);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { color: var(--text-main); }
        .mobile-only { display: none; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
        }
        .card-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
        }

        /* Terminal - 8px Termux Font */
        .terminal-container {
            background: #000000 !important;
            border: 1px solid #1f2430;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            flex: 1;
            height: calc(100vh - 145px);
            min-height: 440px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .terminal-full { height: calc(100vh - 100px); }

        .terminal-screen {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            overflow-x: auto;
            color: #d1d5db;
            background: #000000 !important;
            font-family: 'Courier New', monospace;
            font-size: 8px; /* ৮ পিক্সেল সাইজ */
            line-height: 1.35;
            white-space: pre;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .terminal-screen::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .terminal-input-bar {
            display: flex;
            align-items: center;
            background: #000000;
            border-top: 1px solid #1f2430;
            padding: 0.6rem 0.9rem;
            gap: 0.6rem;
        }
        .terminal-prompt {
            color: #22c55e;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        .terminal-input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #4ade80;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Courier New', monospace;
        }

        /* File Manager & Table */
        .breadcrumb-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-dim);
            overflow-x: auto;
            white-space: nowrap;
        }
        .breadcrumb-item {
            color: var(--color-primary);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .breadcrumb-item:hover { text-decoration: underline; }

        .file-browser-card {
            padding: 0;
            overflow: visible;
        }

        .table-responsive {
            overflow: visible;
            width: 100%;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        .file-table th {
            background: var(--bg-surface);
            color: var(--text-dim);
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            text-transform: uppercase;
        }
        .file-table th:first-child { border-top-left-radius: var(--radius-lg); }
        .file-table th:last-child { border-top-right-radius: var(--radius-lg); }

        .file-table td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .file-table tr:last-child td { border-bottom: none; }
        .file-table tr:hover td { background-color: var(--bg-card-hover); }

        .file-name-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
        }

        .file-icon {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* 3-Dots Dropdown Menu */
        .action-cell {
            position: relative;
            text-align: right;
            width: 46px;
        }

        .dot-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            transition: 0.15s;
        }
        .dot-btn:hover, .dot-btn.active {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 10px;
            top: calc(100% - 2px);
            background: #18202c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-width: 145px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 100;
            flex-direction: column;
            padding: 5px;
            animation: fadeIn 0.15s ease-out;
        }
        .dropdown-menu.show { display: flex; }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 0.82rem;
            color: var(--text-main);
            background: transparent;
            border: none;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
            width: 100%;
            transition: background 0.12s ease;
        }
        .dropdown-item i { width: 16px; text-align: center; }
        .dropdown-item:hover {
            background: rgba(59, 130, 246, 0.18);
            color: var(--color-primary);
        }
        .dropdown-item.danger:hover {
            background: rgba(239, 68, 68, 0.18);
            color: var(--color-danger);
        }

        /* Forms */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-control {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.65rem 0.85rem;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .form-control:focus { border-color: var(--border-focus); }
        .form-hint { font-size: 0.75rem; color: var(--text-dim); }
        .form-actions { display: flex; gap: 0.75rem; }
        .form-actions .btn { flex: none; }

        /* Fullscreen Code Editor */
        .editor-fullscreen-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0d1117;
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .editor-fullscreen-page.show { display: flex; }

        .editor-header {
            height: 52px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.85rem;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .editor-filename-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #c9d1d9;
            max-width: 40%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .zoom-btn-group {
            display: flex;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        .btn-zoom {
            background: transparent;
            border: none;
            color: #c9d1d9;
            padding: 0.35rem 0.55rem;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            font-family: var(--font-mono);
        }
        .btn-zoom:hover { background: #30363d; color: #fff; }

        .btn-save-editor {
            background: #238636;
            color: #fff;
            padding: 0.42rem 0.85rem;
            font-size: 0.82rem;
            border-radius: 6px;
            border: 1px solid rgba(240, 246, 252, 0.1);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .btn-save-editor:hover { background: #2ea043; }

        .btn-close-editor {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.42rem 0.75rem;
            font-size: 0.82rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-close-editor:hover { background: #30363d; color: #fff; }

        .editor-container {
            flex: 1;
            display: flex;
            background: #0d1117;
            overflow: hidden;
            position: relative;
        }
        .editor-textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #e6edf3;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            padding: 0.9rem;
            padding-bottom: 5rem;
            resize: none;
            outline: none;
            tab-size: 4;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            caret-color: #38bdf8;
            -webkit-overflow-scrolling: touch;
        }

        .editor-statusbar {
            height: 30px;
            background: #161b22;
            border-top: 1px solid #21262d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.85rem;
            font-size: 0.72rem;
            color: #8b949e;
            font-family: var(--font-mono);
            user-select: none;
            flex-shrink: 0;
        }

        /* Modal Dialog */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 12, 0.82);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 0.75rem;
        }
        .modal-backdrop.show { display: flex; }
        .modal-window {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            padding: 1.25rem;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-title { font-size: 1.05rem; font-weight: 700; }
        .modal-body { padding: 1rem 0; }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
        .modal-footer .btn { flex: none; }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            z-index: 2000;
            max-width: 360px;
            width: calc(100% - 40px);
        }
        .toast {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.25s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-success { border-left: 4px solid var(--color-success); }
        .toast-error { border-left: 4px solid var(--color-danger); }
        .toast-info { border-left: 4px solid var(--color-primary); }
        .toast-content { flex: 1; font-size: 0.82rem; }
        .toast-title { font-weight: 700; margin-bottom: 2px; }

        /* Responsive Mobile Rules */
        @media (max-width: 860px) {
            .sidebar {
                position: fixed;
                left: 0; top: 60px; bottom: 0;
                z-index: 40;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 10px 0 25px rgba(0, 0, 0, 0.8);
            }
            .mobile-only { display: flex; }
            .content-wrapper { padding: 0.8rem; }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.8rem;
                padding: 0.6rem 0.3rem;
            }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="app-layout">
        <!-- Centered Header -->
        <header class="top-header">
            <button id="mobile-menu-btn" class="header-menu-toggle mobile-only" onclick="toggleSidebar()" aria-label="Open Navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="brand">
                <span class="brand-name">JUBAYER <span class="brand-accent">HOSTING</span></span>
            </div>
        </header>

        <div class="main-body">
            <!-- Sidebar Drawer Backdrop -->
            <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

            <!-- Sidebar Navigation -->
            <aside id="sidebar" class="sidebar">
                <nav class="nav-menu" role="tablist">
                    <button class="nav-item active" data-tab="dashboard">
                        <i class="fa-solid fa-table-columns"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-item" data-tab="console">
                        <i class="fa-solid fa-terminal"></i>
                        <span>Console</span>
                    </button>
                    <button class="nav-item" data-tab="files">
                        <i class="fa-solid fa-folder-open"></i>
                        <span>Files</span>
                    </button>
                    <button class="nav-item" data-tab="startup">
                        <i class="fa-solid fa-sliders"></i>
                        <span>Startup</span>
                    </button>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="content-wrapper">

                <!-- 1. DASHBOARD TAB -->
                <section id="tab-dashboard" class="tab-pane active">
                    <div class="panel-header-row">
                        <!-- Single Line Server Actions -->
                        <div class="action-btn-group">
                            <button id="btn-start" class="btn btn-success" onclick="serverActions.start()">
                                <i class="fa-solid fa-play"></i>
                                <span>Start</span>
                            </button>
                            <button id="btn-stop" class="btn btn-danger" onclick="serverActions.stop()">
                                <i class="fa-solid fa-stop"></i>
                                <span>Stop</span>
                            </button>
                            <button id="btn-restart" class="btn btn-warning" onclick="serverActions.restart()">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Restart</span>
                            </button>
                        </div>
                    </div>

                    <!-- 8px Termux Black Terminal -->
                    <div class="terminal-container">
                        <pre id="terminal-screen" class="terminal-screen font-mono" tabindex="0"><span class="text-muted">~ $ Ready...</span></pre>
                        <form class="terminal-input-bar" onsubmit="consoleTab.submitCommand(event)">
                            <span class="terminal-prompt">$</span>
                            <input type="text" id="terminal-input" class="terminal-input font-mono" placeholder="Type command..." autocomplete="off" spellcheck="false">
                        </form>
                    </div>
                </section>

                <!-- 2. CONSOLE TAB -->
                <section id="tab-console" class="tab-pane">
                    <div class="terminal-container terminal-full">
                        <pre id="tab-terminal-screen" class="terminal-screen font-mono" tabindex="0"><span class="text-muted">~ $ Ready...</span></pre>
                        <form class="terminal-input-bar" onsubmit="consoleTab.submitTabCommand(event)">
                            <span class="terminal-prompt">$</span>
                            <input type="text" id="tab-terminal-input" class="terminal-input font-mono" placeholder="Type command..." autocomplete="off" spellcheck="false">
                        </form>
                    </div>
                </section>

                <!-- 3. FILES TAB WITH 3-DOTS MENU -->
                <section id="tab-files" class="tab-pane">
                    <div class="panel-header-row">
                        <div class="breadcrumb-container" id="file-breadcrumbs">
                            <span class="breadcrumb-item" onclick="fileManager.navigate('')">
                                <i class="fa-solid fa-house"></i>
                                /root
                            </span>
                        </div>
                        <div class="action-btn-group">
                            <input type="file" id="file-upload-input" multiple style="display: none;" onchange="fileManager.handleUpload(event)">
                            <button class="btn btn-secondary" onclick="document.getElementById('file-upload-input').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Upload</span>
                            </button>
                            <button class="btn btn-secondary" onclick="fileManager.openNewFolderModal()">
                                <i class="fa-solid fa-folder-plus"></i>
                                <span>Folder</span>
                            </button>
                            <button class="btn btn-primary" onclick="fileManager.openNewFileModal()">
                                <i class="fa-solid fa-plus"></i>
                                <span>File</span>
                            </button>
                        </div>
                    </div>

                    <!-- Clean Files Card & Table -->
                    <div class="card file-browser-card">
                        <div class="table-responsive">
                            <table class="file-table" id="file-table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th style="text-align: right; width: 60px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="file-list-body">
                                    <tr><td colspan="2" class="text-center py-4 text-muted">Loading directory contents...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- 4. STARTUP TAB -->
                <section id="tab-startup" class="tab-pane">
                    <div class="card max-w-700">
                        <div class="card-header">
                            <h2 class="card-title"><i class="fa-solid fa-gear" style="margin-right: 8px;"></i>Startup Configuration</h2>
                        </div>
                        <form id="startup-form" onsubmit="startupConfig.save(event)">
                            <div class="form-group">
                                <label for="startup-main-file" class="form-label">Main Entrypoint Script</label>
                                <input type="text" id="startup-main-file" class="form-control font-mono" placeholder="main.py" required>
                                <small class="form-hint">The primary Python script executed upon starting the instance.</small>
                            </div>

                            <div class="form-group mt-3">
                                <label for="startup-req-file" class="form-label">Requirements Dependency File</label>
                                <input type="text" id="startup-req-file" class="form-control font-mono" placeholder="requirements.txt">
                                <small class="form-hint">Passed automatically during pip install routines.</small>
                            </div>

                            <div class="form-actions mt-4">
                                <button type="submit" id="btn-save-startup" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    <span>Save Configuration</span>
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="startupConfig.load()">Reset</button>
                            </div>
                        </form>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- FULLSCREEN CODE EDITOR -->
    <div id="editor-page" class="editor-fullscreen-page" aria-hidden="true">
        <div class="editor-header">
            <div class="editor-filename-badge">
                <i class="fa-solid fa-file-code" style="color: var(--color-primary);"></i>
                <span id="editor-filename" class="font-mono">file.py</span>
            </div>

            <div class="editor-actions">
                <div class="zoom-btn-group" title="Adjust Font Size">
                    <button class="btn-zoom" onclick="fileEditor.zoomOut()">A-</button>
                    <button class="btn-zoom" onclick="fileEditor.zoomIn()">A+</button>
                </div>

                <button id="editor-save-btn" class="btn-save-editor" onclick="fileEditor.save()">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save</span>
                </button>
                <button class="btn-close-editor" onclick="fileEditor.close()">
                    <span>Close</span>
                </button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="editor-textarea" class="editor-textarea font-mono" spellcheck="false" placeholder="Write code or text here..."></textarea>
        </div>

        <div class="editor-statusbar">
            <div class="statusbar-left">
                <span id="editor-stat-lines">1 line</span>
                <span>·</span>
                <span>UTF-8</span>
                <span>·</span>
                <span id="editor-stat-lang">Python</span>
            </div>
            <div class="statusbar-right">
                <span id="editor-stat-zoom">13px</span>
            </div>
        </div>
    </div>

    <!-- CLEAN CUSTOM PROMPT / CONFIRM MODAL -->
    <div id="prompt-modal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-window">
            <div class="modal-header">
                <h3 id="prompt-modal-title" class="modal-title">Confirmation</h3>
                <button class="icon-btn" onclick="modalHelper.closePrompt()">✕</button>
            </div>
            <div class="modal-body">
                <p id="prompt-modal-msg" class="text-muted"></p>
                <div id="prompt-modal-input-container" class="mt-3" style="display:none;">
                    <input type="text" id="prompt-modal-input" class="form-control font-mono">
                </div>
            </div>
            <div class="modal-footer">
                <button id="prompt-modal-cancel" class="btn btn-secondary" onclick="modalHelper.closePrompt()">Cancel</button>
                <button id="prompt-modal-confirm" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT CONTROLLER -->
    <script>
        "use strict";

        const CONFIG = {
            SERVER_ID: "default",
            LOGS_POLL_INTERVAL: 1500
        };

        const ansiUp = new AnsiUp();

        /* API CLIENT */
        const api = {
            async request(url, options = {}) {
                try {
                    const res = await fetch(url, {
                        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
                        ...options
                    });
                    const contentType = res.headers.get("content-type");
                    let data = null;
                    if (contentType && contentType.includes("application/json")) {
                        data = await res.json();
                    } else {
                        data = { message: await res.text() };
                    }
                    if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
                    return data;
                } catch (err) {
                    console.error("API error:", err.message);
                    throw err;
                }
            },
            get(url) { return this.request(url, { method: "GET" }); },
            post(url, body) { return this.request(url, { method: "POST", body: JSON.stringify(body) }); },
            delete(url, body) { return this.request(url, { method: "DELETE", body: JSON.stringify(body) }); },
            async upload(url, formData) {
                const res = await fetch(url, { method: "POST", body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Upload failed");
                return data;
            }
        };

        /* TOAST SYSTEM */
        const toast = {
            container: document.getElementById("toast-container"),
            show(type, title, message, timeout = 3500) {
                const item = document.createElement("div");
                item.className = `toast toast-${type}`;
                item.innerHTML = `
                    <div class="toast-content">
                        <div class="toast-title">${modalHelper.escapeHTML(title)}</div>
                        <div>${modalHelper.escapeHTML(message)}</div>
                    </div>
                    <button class="icon-btn" onclick="this.parentElement.remove()">✕</button>
                `;
                this.container.appendChild(item);
                setTimeout(() => { if (item.parentElement) item.remove(); }, timeout);
            },
            success(t, m = "") { this.show("success", t, m); },
            error(t, m = "") { this.show("error", t, m, 5000); },
            info(t, m = "") { this.show("info", t, m); }
        };

        /* MODAL HELPER (SweetAlert Style Custom Dialog) */
        const modalHelper = {
            promptModal: document.getElementById("prompt-modal"),
            titleEl: document.getElementById("prompt-modal-title"),
            msgEl: document.getElementById("prompt-modal-msg"),
            inputContainer: document.getElementById("prompt-modal-input-container"),
            inputEl: document.getElementById("prompt-modal-input"),
            confirmBtn: document.getElementById("prompt-modal-confirm"),

            escapeHTML(str) {
                if (typeof str !== "string") return str;
                return str.replace(/[&<>'"]/g, tag => ({
                    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
                }[tag] || tag));
            },
            confirm(title, message, isDanger = false) {
                return new Promise((resolve) => {
                    this.titleEl.textContent = title;
                    this.msgEl.textContent = message;
                    this.inputContainer.style.display = "none";
                    this.confirmBtn.className = `btn ${isDanger ? "btn-danger" : "btn-primary"}`;
                    this.confirmBtn.textContent = isDanger ? "Delete" : "Confirm";
                    const handleConfirm = () => { cleanup(); resolve(true); };
                    const cleanup = () => {
                        this.confirmBtn.removeEventListener("click", handleConfirm);
                        this.closePrompt();
                    };
                    this.confirmBtn.addEventListener("click", handleConfirm);
                    this.promptModal.classList.add("show");
                });
            },
            prompt(title, message, defaultValue = "") {
                return new Promise((resolve) => {
                    this.titleEl.textContent = title;
                    this.msgEl.textContent = message;
                    this.inputContainer.style.display = "block";
                    this.inputEl.value = defaultValue;
                    this.confirmBtn.className = "btn btn-primary";
                    this.confirmBtn.textContent = "Submit";
                    const handleConfirm = () => {
                        const val = this.inputEl.value.trim();
                        cleanup();
                        resolve(val || null);
                    };
                    const cleanup = () => {
                        this.confirmBtn.removeEventListener("click", handleConfirm);
                        this.closePrompt();
                    };
                    this.confirmBtn.addEventListener("click", handleConfirm);
                    this.promptModal.classList.add("show");
                    setTimeout(() => this.inputEl.focus(), 100);
                });
            },
            closePrompt() { this.promptModal.classList.remove("show"); }
        };

        /* SIDEBAR TOGGLE */
        function toggleSidebar(forceState) {
            const sidebar = document.getElementById("sidebar");
            const backdrop = document.getElementById("sidebar-backdrop");
            const isOpen = forceState !== undefined ? forceState : !sidebar.classList.contains("open");
            sidebar.classList.toggle("open", isOpen);
            backdrop.classList.toggle("show", isOpen);
        }

        /* NAVIGATION TABS */
        function initNavigation() {
            const navItems = document.querySelectorAll(".nav-item");
            navItems.forEach(btn => {
                btn.addEventListener("click", () => {
                    navItems.forEach(b => b.classList.remove("active"));
                    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));

                    btn.classList.add("active");
                    const target = btn.getAttribute("data-tab");
                    const targetPane = document.getElementById(`tab-${target}`);
                    if (targetPane) targetPane.classList.add("active");

                    if (target === "files") fileManager.load();
                    if (target === "startup") startupConfig.load();
                    if (target === "console" || target === "dashboard") pollLogs();

                    toggleSidebar(false);
                });
            });
        }

        /* SERVER CONTROL */
        const serverActions = {
            async start() {
                const btn = document.getElementById("btn-start");
                btn.querySelector("span").textContent = "Starting...";
                try {
                    await api.post(`/api/start/${CONFIG.SERVER_ID}`);
                    toast.success("Server Started", "Process execution initiated");
                } catch (err) { toast.error("Start Failed", err.message); }
                finally { btn.querySelector("span").textContent = "Start"; }
            },
            async stop() {
                const btn = document.getElementById("btn-stop");
                btn.querySelector("span").textContent = "Stopping...";
                try {
                    await api.post(`/api/stop/${CONFIG.SERVER_ID}`);
                    toast.info("Server Stopped", "Process termination sent");
                } catch (err) { toast.error("Stop Failed", err.message); }
                finally { btn.querySelector("span").textContent = "Stop"; }
            },
            async restart() {
                try {
                    await api.post(`/api/restart/${CONFIG.SERVER_ID}`);
                    toast.success("Restarting Server", "Process cycle initiated");
                } catch (err) { toast.error("Restart Failed", err.message); }
            }
        };

        /* TERMINAL / LOGS */
        let lastLogText = "";
        const consoleTab = {
            screen: document.getElementById("terminal-screen"),
            input: document.getElementById("terminal-input"),
            tabScreen: document.getElementById("tab-terminal-screen"),
            tabInput: document.getElementById("tab-terminal-input"),

            clear() {
                if (this.screen) this.screen.innerHTML = '<span class="text-muted">~ $ Ready...</span>';
                if (this.tabScreen) this.tabScreen.innerHTML = '<span class="text-muted">~ $ Ready...</span>';
                lastLogText = "";
            },
            async submitCommand(e) {
                e.preventDefault();
                const cmd = this.input.value.trim();
                if (!cmd) return;
                if (cmd === "clear" || cmd === "cls") { this.clear(); this.input.value = ""; return; }
                this.input.value = "";

                try {
                    await api.post("/api/command", { server_id: CONFIG.SERVER_ID, cmd: cmd });
                    pollLogs();
                } catch (err) { toast.error("Execution Failed", err.message); }
            },
            async submitTabCommand(e) {
                e.preventDefault();
                const cmd = this.tabInput.value.trim();
                if (!cmd) return;
                if (cmd === "clear" || cmd === "cls") { this.clear(); this.tabInput.value = ""; return; }
                this.tabInput.value = "";

                try {
                    await api.post("/api/command", { server_id: CONFIG.SERVER_ID, cmd: cmd });
                    pollLogs();
                } catch (err) { toast.error("Execution Failed", err.message); }
            }
        };

        async function pollLogs() {
            try {
                const res = await api.get(`/api/logs/${CONFIG.SERVER_ID}`);
                let rawLogs = typeof res === "string" ? res : (res.logs || res.output || "");
                if (rawLogs && rawLogs !== lastLogText) {
                    if (rawLogs.includes('\x1b[2J') || rawLogs.includes('[H[2J')) {
                        let parts = rawLogs.split(/\x1b\[2J|\[H\[2J/);
                        rawLogs = parts[parts.length - 1];
                    }
                    const parsedHTML = ansiUp.ansi_to_html(rawLogs);
                    if (consoleTab.screen) {
                        consoleTab.screen.innerHTML = parsedHTML;
                        consoleTab.screen.scrollTop = consoleTab.screen.scrollHeight;
                    }
                    if (consoleTab.tabScreen) {
                        consoleTab.tabScreen.innerHTML = parsedHTML;
                        consoleTab.tabScreen.scrollTop = consoleTab.tabScreen.scrollHeight;
                    }
                    lastLogText = rawLogs;
                }
            } catch (e) {}
        }

        /* FILE MANAGER WITH 3-DOTS MENU & FONTAWESOME */
        const fileManager = {
            currentPath: "",

            getFileIcon(filename, isDir, isZip) {
                if (isDir) return `<i class="fa-solid fa-folder" style="color: #f59e0b;"></i>`;
                if (isZip || filename.endsWith('.zip')) return `<i class="fa-solid fa-file-zipper" style="color: #ec4899;"></i>`;
                if (filename.endsWith('.py')) return `<i class="fa-brands fa-python" style="color: #3b82f6;"></i>`;
                if (filename.endsWith('.json')) return `<i class="fa-solid fa-file-code" style="color: #10b981;"></i>`;
                if (filename.endsWith('.txt') || filename.endsWith('.md')) return `<i class="fa-solid fa-file-lines" style="color: #94a3b8;"></i>`;
                if (filename.endsWith('.sh')) return `<i class="fa-solid fa-terminal" style="color: #22c55e;"></i>`;
                return `<i class="fa-solid fa-file" style="color: #94a3b8;"></i>`;
            },

            async load(path = this.currentPath) {
                this.currentPath = path;
                this.renderBreadcrumbs();
                const tbody = document.getElementById("file-list-body");
                tbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-muted">Fetching files...</td></tr>`;

                try {
                    const res = await api.get(`/api/files/${CONFIG.SERVER_ID}?path=${encodeURIComponent(this.currentPath)}`);
                    const files = res.files || [];
                    tbody.innerHTML = "";

                    if (this.currentPath !== "") {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td colspan="2">
                                <div class="file-name-cell" onclick="fileManager.navigateUp()">
                                    <span class="file-icon"><i class="fa-solid fa-level-up-alt" style="color: var(--color-primary);"></i></span>
                                    <span class="font-mono" style="color: var(--color-primary); font-weight: bold;">..</span>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    }

                    if (!files.length && !this.currentPath) {
                        tbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-muted">Directory is empty</td></tr>`;
                        return;
                    }

                    files.forEach(f => {
                        const tr = document.createElement("tr");
                        const isDir = Boolean(f.is_dir);
                        const isZip = f.name.endsWith(".zip");
                        const fullPath = this.currentPath ? `${this.currentPath}/${f.name}` : f.name;
                        const iconHtml = this.getFileIcon(f.name, isDir, isZip);

                        tr.innerHTML = `
                            <td>
                                <div class="file-name-cell" onclick="fileManager.handleItemClick('${modalHelper.escapeHTML(fullPath)}', ${isDir})">
                                    <span class="file-icon">${iconHtml}</span>
                                    <span class="font-mono">${modalHelper.escapeHTML(f.name)}</span>
                                </div>
                            </td>
                            <td class="action-cell">
                                <button class="dot-btn" onclick="fileManager.toggleDropdown(event, this)">
                                    <i class="fa-solid fa-ellipsis-vertical"></i>
                                </button>
                                <div class="dropdown-menu">
                                    ${!isDir ? `<button class="dropdown-item" onclick="fileEditor.open('${modalHelper.escapeHTML(fullPath)}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
                                    ${isZip ? `<button class="dropdown-item" onclick="fileManager.extractZip('${modalHelper.escapeHTML(fullPath)}')"><i class="fa-solid fa-box-open"></i> Extract</button>` : ''}
                                    <button class="dropdown-item" onclick="fileManager.renameItem('${modalHelper.escapeHTML(fullPath)}')"><i class="fa-solid fa-pen"></i> Rename</button>
                                    <button class="dropdown-item danger" onclick="fileManager.deleteItem('${modalHelper.escapeHTML(fullPath)}')"><i class="fa-solid fa-trash-can"></i> Delete</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    toast.error("Files Error", err.message);
                }
            },

            toggleDropdown(e, btn) {
                e.stopPropagation();
                const currentMenu = btn.nextElementSibling;
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    if (menu !== currentMenu) menu.classList.remove('show');
                });
                document.querySelectorAll('.dot-btn').forEach(b => {
                    if (b !== btn) b.classList.remove('active');
                });
                currentMenu.classList.toggle('show');
                btn.classList.toggle('active');
            },

            renderBreadcrumbs() {
                const bc = document.getElementById("file-breadcrumbs");
                bc.innerHTML = `
                    <span class="breadcrumb-item" onclick="fileManager.navigate('')">
                        <i class="fa-solid fa-house"></i>
                        /root
                    </span>
                `;
                if (!this.currentPath) return;
                const parts = this.currentPath.split("/").filter(Boolean);
                let acc = "";
                parts.forEach(p => {
                    acc += (acc ? "/" : "") + p;
                    const target = acc;
                    bc.innerHTML += ` / <span class="breadcrumb-item" onclick="fileManager.navigate('${target}')">${modalHelper.escapeHTML(p)}</span>`;
                });
            },

            navigate(path) { this.load(path); },
            navigateUp() {
                const parts = this.currentPath.split("/").filter(Boolean);
                parts.pop();
                this.navigate(parts.join("/"));
            },
            handleItemClick(path, isDir) {
                if (isDir) this.navigate(path);
                else fileEditor.open(path);
            },
            async openNewFileModal() {
                const name = await modalHelper.prompt("Create New File", "Enter file name (e.g. app.py):");
                if (!name) return;
                const path = this.currentPath ? `${this.currentPath}/${name}` : name;
                await api.post(`/api/file/${CONFIG.SERVER_ID}`, { path, content: "" });
                toast.success("Created file", name);
                this.load();
                fileEditor.open(path);
            },
            async openNewFolderModal() {
                const name = await modalHelper.prompt("Create New Folder", "Enter folder name:");
                if (!name) return;
                const path = this.currentPath ? `${this.currentPath}/${name}` : name;
                await api.post(`/api/create_folder/${CONFIG.SERVER_ID}`, { path, folder_name: name });
                toast.success("Created folder", name);
                this.load();
            },
            async renameItem(oldPath) {
                const currentName = oldPath.split("/").pop();
                const newName = await modalHelper.prompt("Rename Item", "Enter new name:", currentName);
                if (!newName || newName === currentName) return;
                const parentDir = oldPath.includes("/") ? oldPath.substring(0, oldPath.lastIndexOf("/")) : "";
                const newPath = parentDir ? `${parentDir}/${newName}` : newName;
                await api.post(`/api/rename/${CONFIG.SERVER_ID}`, { old_path: oldPath, new_path: newPath });
                toast.success("Renamed", newName);
                this.load();
            },
            async extractZip(filePath) {
                await api.post(`/api/extract/${CONFIG.SERVER_ID}`, { file_path: filePath, target_path: this.currentPath || "" });
                toast.success("Extraction Done", filePath);
                this.load();
            },
            async deleteItem(path) {
                const confirmed = await modalHelper.confirm("Delete File/Folder", `Are you sure you want to delete "${path}"?`, true);
                if (!confirmed) return;
                await api.delete(`/api/file/${CONFIG.SERVER_ID}`, { path });
                toast.info("Deleted", path);
                this.load();
            },
            async handleUpload(e) {
                const files = e.target.files;
                if (!files.length) return;
                const fd = new FormData();
                for (let i = 0; i < files.length; i++) fd.append("file", files[i]);
                fd.append("path", this.currentPath || "");
                await api.upload(`/api/upload/${CONFIG.SERVER_ID}`, fd);
                toast.success("Uploaded successfully");
                this.load();
                e.target.value = "";
            }
        };

        // Close dropdown when clicked anywhere outside
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
            document.querySelectorAll('.dot-btn').forEach(btn => btn.classList.remove('active'));
        });

        /* CODE EDITOR */
        const fileEditor = {
            page: document.getElementById("editor-page"),
            textarea: document.getElementById("editor-textarea"),
            saveBtn: document.getElementById("editor-save-btn"),
            filenameLabel: document.getElementById("editor-filename"),
            statLines: document.getElementById("editor-stat-lines"),
            statLang: document.getElementById("editor-stat-lang"),
            statZoom: document.getElementById("editor-stat-zoom"),
            currentPath: null,
            initialContent: "",
            fontSize: 13,

            detectLanguage(filename) {
                if (!filename) return "Text";
                const ext = filename.split('.').pop().toLowerCase();
                const map = { py: "Python", js: "JavaScript", json: "JSON", html: "HTML", css: "CSS", sh: "Shell", txt: "Text", md: "Markdown" };
                return map[ext] || "Text";
            },

            zoomIn() {
                if (this.fontSize < 30) {
                    this.fontSize += 2;
                    this.applyFontSize();
                }
            },
            zoomOut() {
                if (this.fontSize > 9) {
                    this.fontSize -= 2;
                    this.applyFontSize();
                }
            },
            applyFontSize() {
                this.textarea.style.fontSize = `${this.fontSize}px`;
                this.statZoom.textContent = `${this.fontSize}px`;
            },

            async open(filePath) {
                this.currentPath = filePath;
                this.filenameLabel.textContent = filePath.split("/").pop();
                this.statLang.textContent = this.detectLanguage(filePath);
                this.applyFontSize();
                this.page.classList.add("show");

                try {
                    const res = await api.get(`/api/file/${CONFIG.SERVER_ID}?path=${encodeURIComponent(filePath)}`);
                    const content = res.content !== undefined ? res.content : "";
                    this.textarea.value = content;
                    this.initialContent = content;
                    this.updateStats();
                    this.textarea.scrollTop = 0;
                } catch (err) {
                    toast.error("Failed to Open File", err.message);
                    this.close();
                }
            },

            async save() {
                if (!this.currentPath) return;
                this.saveBtn.disabled = true;
                try {
                    await api.post(`/api/file/${CONFIG.SERVER_ID}`, { path: this.currentPath, content: this.textarea.value });
                    this.initialContent = this.textarea.value;
                    toast.success("File Saved", this.currentPath);
                } catch (err) { toast.error("Save Failed", err.message); }
                finally { this.saveBtn.disabled = false; }
            },

            close() {
                if (this.textarea.value !== this.initialContent && !confirm("Discard unsaved changes?")) return;
                this.page.classList.remove("show");
                this.currentPath = null;
            },

            updateStats() {
                const lines = this.textarea.value.split("\n").length;
                this.statLines.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'}`;
            }
        };

        fileEditor.textarea.addEventListener("input", () => fileEditor.updateStats());
        fileEditor.textarea.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                const start = fileEditor.textarea.selectionStart;
                const end = fileEditor.textarea.selectionEnd;
                fileEditor.textarea.value = fileEditor.textarea.value.substring(0, start) + "    " + fileEditor.textarea.value.substring(end);
                fileEditor.textarea.selectionStart = fileEditor.textarea.selectionEnd = start + 4;
            }
            if ((e.ctrlKey || e.metaKey) && e.key === "s") {
                e.preventDefault();
                fileEditor.save();
            }
        });

        /* STARTUP CONFIG */
        const startupConfig = {
            async load() {
                try {
                    const data = await api.get(`/api/get_startup/${CONFIG.SERVER_ID}`);
                    document.getElementById("startup-main-file").value = data.main_file || "main.py";
                    document.getElementById("startup-req-file").value = data.req_file || "requirements.txt";
                } catch (e) {}
            },
            async save(e) {
                e.preventDefault();
                await api.post(`/api/set_startup/${CONFIG.SERVER_ID}`, {
                    main_file: document.getElementById("startup-main-file").value.trim(),
                    req_file: document.getElementById("startup-req-file").value.trim()
                });
                toast.success("Startup Configuration Saved");
            }
        };

        /* INITIALIZATION */
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation();
            pollLogs();
            setInterval(pollLogs, CONFIG.LOGS_POLL_INTERVAL);
        });
    </script>
</body>
</html>
